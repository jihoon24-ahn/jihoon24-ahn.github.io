name: Update report list

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - ".github/workflows/update-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report-list:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create reports.json
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          pattern = re.compile(r"^\d{4}-\d{2}-\d{2}\.html$")
          reports = sorted(
              [
                  path.name
                  for path in Path(".").glob("*.html")
                  if pattern.fullmatch(path.name)
              ],
              reverse=True,
          )

          Path("reports.json").write_text(
              json.dumps(reports, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Commit reports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json
          if git diff --cached --quiet; then
            echo "The report list is already current."
          else
            git commit -m "Update report list"
            git push
          fi
