name: Update report list

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - ".github/workflows/update-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report-list:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create reports.json
        shell: python
        run: |
          import json
          import re
          from html import unescape
          from pathlib import Path

          pattern = re.compile(r"^(\d{4}-\d{2}-\d{2})(?:-(\d{2}))?\.html$")
          teacher_meta = re.compile(
              r'<meta\s+name="report-teacher"\s+content="([^"]*)"',
              re.IGNORECASE,
          )
          teacher_text = re.compile(r"Conversation with\s+([^<·]+?)\s*·", re.IGNORECASE)
          reports = []

          for path in Path(".").glob("*.html"):
              match = pattern.fullmatch(path.name)
              if not match:
                  continue

              contents = path.read_text(encoding="utf-8")
              teacher_match = teacher_meta.search(contents) or teacher_text.search(contents)
              teacher = unescape(teacher_match.group(1).strip()) if teacher_match else ""
              reports.append(
                  {
                      "name": path.name,
                      "date": match.group(1),
                      "session": int(match.group(2) or 1),
                      "teacher": teacher,
                  }
              )

          reports.sort(key=lambda report: (report["date"], report["session"]), reverse=True)

          Path("reports.json").write_text(
              json.dumps(reports, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Commit reports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json
          if git diff --cached --quiet; then
            echo "The report list is already current."
          else
            git commit -m "Update report list"
            git push
          fi
