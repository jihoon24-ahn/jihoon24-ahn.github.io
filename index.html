<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An archive of English conversation class progress reports.">
  <title>English Progress Reports</title>
  <style>
    :root {
      --background: #f7f7f5;
      --surface: #ffffff;
      --text: #252525;
      --muted: #6b6b6b;
      --border: #e7e5e1;
      --accent: #2f6f62;
      --accent-soft: #e9f2ef;
      --shadow: 0 12px 36px rgba(35, 35, 35, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.65;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .page-header { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(2rem, 7vw, 3.35rem);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 650px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 0 14px;
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 650;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 13px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { border-color: #cbc8c2; }
    button:focus-visible, a:focus-visible { outline: 3px solid #8dc5b8; outline-offset: 3px; }

    .reports {
      display: grid;
      gap: 12px;
    }

    .report {
      display: block;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(35, 35, 35, 0.025);
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .report:hover {
      transform: translateY(-2px);
      border-color: #cbc8c2;
      box-shadow: var(--shadow);
    }

    .report-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .report-date {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .badge {
      flex: none;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 9px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .report-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .open-label { color: var(--accent); font-weight: 750; }

    .status {
      padding: 28px 22px;
      border: 1px dashed #cfccc6;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      text-align: center;
    }

    .status strong { color: var(--text); }
    .status p { margin: 7px 0 0; }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.76rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      body { font-size: 17px; }
      main { width: min(100% - 22px, 760px); padding: 34px 0 52px; }
      .report { padding: 19px 17px; border-radius: 14px; }
      .report-meta { align-items: flex-end; }
      .filename { overflow-wrap: anywhere; }
    }

    @media (prefers-reduced-motion: reduce) {
      .report { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <p class="eyebrow">English learning archive</p>
      <h1>English Progress Reports</h1>
      <p class="intro">A dated collection of conversation feedback, key corrections, model sentences, and practical next-class targets.</p>
    </header>

    <section aria-labelledby="archive-heading">
      <div class="toolbar">
        <p class="count" id="archive-heading" aria-live="polite">Finding reports…</p>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="reports" id="report-list" aria-live="polite">
        <div class="status">Loading your reports…</div>
      </div>
    </section>

    <noscript>
      <div class="status"><strong>JavaScript is required.</strong><p>Please enable it so this page can find your reports automatically.</p></div>
    </noscript>

    <footer>Reports are listed automatically from the root of the main branch.</footer>
  </main>

  <script>
    (() => {
      "use strict";

      const list = document.getElementById("report-list");
      const count = document.getElementById("archive-heading");
      const refresh = document.getElementById("refresh");
      const reportPattern = /^\d{4}-\d{2}-\d{2}\.html$/;

      function repositoryFromPage() {
        const query = new URLSearchParams(window.location.search);
        const suppliedOwner = query.get("owner");
        const suppliedRepo = query.get("repo");

        if (suppliedOwner && suppliedRepo) {
          return { owner: suppliedOwner, repo: suppliedRepo };
        }

        const host = window.location.hostname.toLowerCase();
        if (!host.endsWith(".github.io")) return null;

        const owner = host.slice(0, -".github.io".length);
        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const repo = pathParts.length ? pathParts[0] : `${owner}.github.io`;
        return { owner, repo };
      }

      function readableDate(filename) {
        const [year, month, day] = filename.slice(0, 10).split("-").map(Number);
        const date = new Date(year, month - 1, day);
        return new Intl.DateTimeFormat("en", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);
      }

      function showStatus(title, detail) {
        list.replaceChildren();
        const box = document.createElement("div");
        box.className = "status";
        const heading = document.createElement("strong");
        heading.textContent = title;
        const message = document.createElement("p");
        message.textContent = detail;
        box.append(heading, message);
        list.append(box);
      }

      function renderReports(files) {
        list.replaceChildren();
        count.textContent = `${files.length} ${files.length === 1 ? "report" : "reports"}`;

        if (!files.length) {
          showStatus("No reports found yet.", "Upload a report named YYYY-MM-DD.html beside this index.html file.");
          return;
        }

        files.forEach((file, index) => {
          const card = document.createElement("a");
          card.className = "report";
          card.href = `./${encodeURIComponent(file.name)}`;

          const top = document.createElement("div");
          top.className = "report-top";
          const date = document.createElement("p");
          date.className = "report-date";
          date.textContent = readableDate(file.name);
          top.append(date);

          if (index === 0) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "Latest";
            top.append(badge);
          }

          const meta = document.createElement("div");
          meta.className = "report-meta";
          const filename = document.createElement("span");
          filename.className = "filename";
          filename.textContent = file.name;
          const open = document.createElement("span");
          open.className = "open-label";
          open.textContent = "Open →";
          meta.append(filename, open);
          card.append(top, meta);
          list.append(card);
        });
      }

      async function loadReports() {
        refresh.disabled = true;
        count.textContent = "Finding reports…";
        showStatus("Loading your reports…", "This should take only a moment.");

        const repository = repositoryFromPage();
        if (!repository) {
          count.textContent = "Preview mode";
          showStatus(
            "This automatic list runs on GitHub Pages.",
            "Upload index.html to the root of your main branch, then open your GitHub Pages address."
          );
          refresh.disabled = false;
          return;
        }

        const { owner, repo } = repository;
        const endpoint = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents?ref=main`;

        try {
          const response = await fetch(endpoint, {
            headers: { Accept: "application/vnd.github+json" }
          });

          if (!response.ok) {
            throw new Error(`GitHub returned ${response.status}`);
          }

          const contents = await response.json();
          if (!Array.isArray(contents)) throw new Error("Unexpected repository response");

          const reports = contents
            .filter(item => item.type === "file" && reportPattern.test(item.name))
            .sort((a, b) => b.name.localeCompare(a.name));

          renderReports(reports);
        } catch (error) {
          count.textContent = "Reports unavailable";
          showStatus(
            "The report list could not be loaded.",
            "Check that the repository is public and GitHub Pages uses the root of the main branch, then try Refresh."
          );
          console.error(error);
        } finally {
          refresh.disabled = false;
        }
      }

      refresh.addEventListener("click", loadReports);
      loadReports();
    })();
  </script>
</body>
</html>
